# Force GRUB timeout to 2 seconds and prevent the 30-second recordfail countdown
# recordfail is for instance set when a freshly installed laptop is tested but powered off by the installer
# The correct way to power off (and not create a new user) is
# CTRL_ALT F2 -> log in with oem/oem
# sudo -i
# grub-editenv /boot/grub/grubenv unset recordfail
# poweroff
#GRUB_TIMEOUT_STYLE=menu
#GRUB_TIMEOUT=2
GRUB_RECORDFAIL_TIMEOUT=2
